name: .NET Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test with coverage
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./TestResults/**/coverage.cobertura.xml
        # Don't fail the build if Codecov is unavailable or no token is configured.
        fail_ci_if_error: false
    - name: Pack
      run: dotnet pack src/ExcelMapper.csproj --configuration Release --no-build
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "Nuget Package"
        path: |
          src/bin/Release/*.nupkg
          src/bin/Release/*.snupkg
