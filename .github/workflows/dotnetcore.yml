name: .NET Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test with coverage
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./TestResults/**/coverage.cobertura.xml
        # Don't fail the build if Codecov is unavailable or no token is configured.
        fail_ci_if_error: false
    - name: Build the benchmarks against 3.0.3
      # benchmarks/README.md: the Mapping benchmarks also build against the 3.x package, to compare versions.
      run: dotnet build benchmarks --configuration Release
      env:
        EXCELMAPPER_VERSION: 3.0.3
    - name: Pack
      run: dotnet pack src/ExcelMapper.csproj --configuration Release --no-build
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "Nuget Package"
        path: |
          src/bin/Release/*.nupkg
          src/bin/Release/*.snupkg

  # The package also contains netstandard2.0 and netstandard2.1 builds, which .NET Framework and
  # older .NET apps use and which take different code paths. Run the tests against those builds too
  # (on the .NET 8 runtime). Tests of APIs that only exist in the net8.0 build are excluded with
  # #if LIBRARY_NET8.
  test-netstandard:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        library-target-framework: [ netstandard2.0, netstandard2.1 ]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Test against the ${{ matrix.library-target-framework }} build
      run: dotnet test tests --configuration Release --verbosity normal -p:LibraryTargetFramework=${{ matrix.library-target-framework }}

  # Publish and run a trimmed app that maps rows, to check the trimming annotations keep what
  # mapping needs. The library build itself fails on trimming and AOT analyzer warnings.
  test-trimming:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish trimmed
      run: dotnet publish tests/TrimmingTests --configuration Release --runtime linux-x64 --output trimming-out
    - name: Run
      run: ./trimming-out/TrimmingTests

  # Publish and run a native AOT app that maps rows with class maps of built-in types, which native
  # AOT supports. Native AOT compiles with clang and links zlib.
  test-aot:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install the native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish with native AOT
      run: dotnet publish tests/AotTests --configuration Release --runtime linux-x64 --output aot-out
    - name: Run
      run: ./aot-out/AotTests
